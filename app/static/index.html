<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Docker Manager</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></symbol>
  <symbol id="i-restart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4.5V11h-6"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="6" width="3.5" height="12" rx="1.2"/><rect x="13.5" y="6" width="3.5" height="12" rx="1.2"/></symbol>
  <symbol id="i-logs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5h14M5 10h10M5 15h14M5 20h8"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5V5a2 2 0 0 1 2-2h7.5L21 11.5 12.5 20z"/><circle cx="7.8" cy="7.8" r="1.4" fill="currentColor"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 5l4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 4.5V10H15"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8l-4 4 4 4M6 12h9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 7"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 1 0-5.6l2.5-2.5a4 4 0 0 1 5.6 5.6L16.5 13"/><path d="M14 10a4 4 0 0 1 0 5.6L11.5 18a4 4 0 0 1-5.6-5.6L7.5 11"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></symbol>
</svg>

<!-- ------------------------------ LOGIN ------------------------------ -->
<div id="login-screen" class="login-screen" hidden>
  <form id="login-form" class="login-card">
    <div class="login-brand"><svg class="ic ic-lg"><use href="#i-box"/></svg></div>
    <h1>Docker Manager</h1>
    <p class="muted">Accedi per gestire i container</p>
    <label class="field"><span>Utente</span><input name="username" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="form-error" hidden></p>
    <button class="btn btn-primary btn-block" type="submit">Entra</button>
  </form>
</div>

<!-- ------------------------------- APP ------------------------------- -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <button class="icon-btn only-mobile" id="btn-menu" title="Menu"><svg class="ic"><use href="#i-logs"/></svg></button>
    <a class="brand" href="#containers">
      <span class="brand-mark"><svg class="ic"><use href="#i-box"/></svg></span>
      <span class="brand-text">Docker<strong>Manager</strong></span>
    </a>

    <div id="docker-status" class="pill pill-muted" title="Stato del daemon Docker">
      <span class="dot"></span><span class="pill-label">connessione…</span>
    </div>

    <div class="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Cerca container, immagine, stack…  (/)" autocomplete="off">
    </div>

    <div class="topbar-actions">
      <label class="switch" title="Aggiornamento automatico ogni 5 secondi">
        <input type="checkbox" id="auto-refresh" checked><span class="switch-track"></span>
        <span class="switch-label">Live</span>
      </label>
      <button class="icon-btn" id="btn-refresh" title="Aggiorna ora"><svg class="ic"><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" id="btn-theme" title="Tema chiaro/scuro"><svg class="ic"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="btn-logout" title="Esci" hidden><svg class="ic"><use href="#i-logout"/></svg></button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <nav class="nav">
      <button class="nav-item is-active" data-view="containers"><svg class="ic"><use href="#i-box"/></svg>Container<span class="nav-count" id="nav-count-containers"></span></button>
      <button class="nav-item" data-view="categories"><svg class="ic"><use href="#i-tag"/></svg>Categorie<span class="nav-count" id="nav-count-categories"></span></button>
      <button class="nav-item" data-view="schedules"><svg class="ic"><use href="#i-clock"/></svg>Pianificazioni<span class="nav-count" id="nav-count-schedules"></span></button>
      <button class="nav-item" data-view="activity"><svg class="ic"><use href="#i-pulse"/></svg>Attività</button>
    </nav>

    <div class="side-block">
      <div class="side-title">Stato</div>
      <div class="chip-col" id="state-filters"></div>
    </div>

    <div class="side-block">
      <div class="side-title">Categorie<button class="side-add" id="btn-new-category-side" title="Nuova categoria"><svg class="ic"><use href="#i-plus"/></svg></button></div>
      <div class="side-list" id="side-categories"></div>
    </div>

    <div class="side-block">
      <div class="side-title">Stack</div>
      <div class="side-list" id="side-stacks"></div>
    </div>

    <div class="side-foot">
      <span id="host-info"></span>
    </div>
  </aside>

  <main class="content">

    <!-- CONTAINER -->
    <section class="view is-active" data-view="containers">
      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <div class="toolbar-left">
          <h2 class="view-title">Container</h2>
          <span class="muted" id="filter-note"></span>
        </div>
        <div class="toolbar-right">
          <div class="segmented" id="group-mode">
            <button data-group="none" class="is-active">Elenco</button>
            <button data-group="category">Per categoria</button>
            <button data-group="stack">Per stack</button>
          </div>
          <button class="btn btn-ghost" id="btn-select-all"><svg class="ic"><use href="#i-check"/></svg>Seleziona tutti</button>
        </div>
      </div>

      <div id="containers-root" class="groups"></div>
    </section>

    <!-- CATEGORIE -->
    <section class="view" data-view="categories">
      <div class="toolbar">
        <div class="toolbar-left"><h2 class="view-title">Categorie</h2>
          <span class="muted">Raggruppa i container per avviarli o spegnerli in blocco</span></div>
        <div class="toolbar-right">
          <button class="btn btn-primary" id="btn-new-category"><svg class="ic"><use href="#i-plus"/></svg>Nuova categoria</button>
        </div>
      </div>
      <div id="categories-root" class="card-grid"></div>
    </section>

    <!-- PIANIFICAZIONI -->
    <section class="view" data-view="schedules">
      <div class="toolbar">
        <div class="toolbar-left"><h2 class="view-title">Pianificazioni</h2>
          <span class="muted" id="tz-note"></span></div>
        <div class="toolbar-right">
          <button class="btn btn-primary" id="btn-new-schedule"><svg class="ic"><use href="#i-plus"/></svg>Nuova pianificazione</button>
        </div>
      </div>
      <div id="schedules-root" class="card-grid"></div>
    </section>

    <!-- ATTIVITÀ -->
    <section class="view" data-view="activity">
      <div class="toolbar">
        <div class="toolbar-left"><h2 class="view-title">Attività</h2>
          <span class="muted">Storico di azioni manuali e pianificate</span></div>
        <div class="toolbar-right">
          <button class="btn btn-ghost" id="btn-clear-activity"><svg class="ic"><use href="#i-trash"/></svg>Svuota</button>
        </div>
      </div>
      <div id="activity-root" class="panel"></div>
    </section>

  </main>

  <div id="bulkbar" class="bulkbar" hidden></div>
</div>

<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
