[project]
name = "docker-manager"
version = "1.0.0"
description = "Gestione, raggruppamento per categorie e pianificazione dei container Docker da interfaccia web"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py312"
# extend-exclude e non exclude: quest'ultimo sostituirebbe le esclusioni
# predefinite di ruff (.venv, .git, __pycache__…) facendogli analizzare
# anche le dipendenze installate in un virtualenv dentro il progetto
extend-exclude = ["app/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # Depends() nei default degli endpoint FastAPI
  "RUF001",  # caratteri unicode nelle stringhe italiane
  "RUF002",
  "RUF003",
]

[tool.pytest.ini_options]
# senza questo `pytest` (lo script console) non trova il pacchetto `app`:
# a differenza di `python -m pytest` non aggiunge la cartella corrente a sys.path
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
